<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>オフライン - 宮大非公式アプリ</title>
<style>
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #fafafa;
    color: #374151;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 320px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 13px; color: #6b7280; line-height: 1.6; margin: 0 0 16px; }
  button {
    border: 1px solid #d1d5db;
    background: #111827;
    color: #fff;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>オフラインです</h1>
    <p>このページはまだ一度も表示したことがないため、通信が無い状態では開けません。電波の良い場所で一度開くと、次回からオフラインでも表示できるようになります。</p>
    <button onclick="location.reload()">再読み込み</button>
  </div>
</body>
</html>
